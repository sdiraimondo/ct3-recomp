; Configuration de Crazy Taxi 3 (port Linux).
;
; Ce fichier est lu au démarrage, dans le répertoire courant (ou le chemin de la variable CT3_CONFIG).
; Les valeurs absentes gardent le réglage par défaut. Les lignes commencent par ; ou #.
; À terme, d'autres sections (résolution, réglages du jeu) s'ajouteront ici.

[Controller]
; Seuils du stick gauche et des déclencheurs (valeurs SDL : 0 à 32767).
DeadZone=16000
TriggerThreshold=16000

; Entrée de la manette = touche du jeu.
; Entrées : a b x y back guide start lstick rstick lb rb dpad_up dpad_down dpad_left dpad_right
;           lt rt lstick_left lstick_right lstick_up lstick_down
; Touches : up down left right enter escape x s z c space tab none
;
; Mapping Xbox de Crazy Taxi 3. Une manette PlayStation suit ce mapping 1-1 (croix = a, rond = b,
; carré = x, triangle = y, L2 = lt, R2 = rt).
a=X            ; A (croix) : marche arrière (Reverse) ; valide aussi dans les menus
b=S            ; B (rond) : passer en marche avant (Drive)
x=none         ; X (carré) : klaxon, touche à définir
y=space         ; Y (triangle) : passagers ou vue selon la configuration, touche à définir
start=enter    ; Start : pause, validation dans les menus
back=escape    ; Select / View : retour dans les menus
lb=none
rb=none
lt=down        ; LT (L2) : frein
rt=up          ; RT (R2) : accélérateur
dpad_up=up     ; croix directionnelle : menus
dpad_down=down
dpad_left=left ; croix directionnelle : diriger
dpad_right=right
lstick_left=left    ; joystick gauche : diriger
lstick_right=right
lstick_up=none      ; haut/bas du joystick non utilisés (la croix sert aux menus)
lstick_down=none

[Patches]
; Saut des logos au démarrage : 1 = activé, 0 = désactivé.
SkipIntro=1
; Correctif des textures de l'interface (coordonnées déformées après un matériau à réflexion) : 1 = activé.
UiTexcoord=1

[Game]
; Format de l'image de la caméra : 16:9 (réglage de cette version) ou 4:3 (format d'origine du jeu).
; Absent : le format du fichier du jeu est conservé.
Aspect=16:9
; Champ de vision horizontal en degrés. Absent : 60 en 4:3, 80 en 16:9.
; Fov=80

[Distance]
; Facteur des distances de la carte (maillage, nombre de maillages, LOD, plan lointain). 1.0 = valeur d'origine.
; taxipatch utilise 2.0 par défaut (décision en attente).
Map=2.0
